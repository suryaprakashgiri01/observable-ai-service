# Alertmanager → app. One receiver: the in-app notification webhook.
route:
  receiver: in-app
  group_by: [alertname, route, status]
  group_wait: 5s       # demo-friendly; production is usually 30s+
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: in-app
    webhook_configs:
      # host.docker.internal reaches the app both under `make up` (published :8000)
      # and `make dev` (app on the host), like the Prometheus scrape target.
      - url: http://host.docker.internal:8000/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: local-alert-token   # = ALERT_WEBHOOK_TOKEN in .env
