# Install with `make install` (runs `pre-commit install`).
# Run over everything with: uv run pre-commit run --all-files
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Runs in the project venv so it sees exactly the installed dependencies,
      # instead of a second list that drifts from pyproject.toml.
      - id: mypy
        name: mypy --strict
        entry: uv run --native-tls mypy app scripts
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
